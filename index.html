<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RA - Realidad Aumentada</title>
    
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      .a-enter-vr { display: none !important; }
    </style>
  </head>
  <body>

    <!-- Escena configurada con el archivo de rastreo -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="video1" src="./lado_claro_2.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video2" src="./lado_oscuro.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video3" src="./lado_oscuro_2.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video4" src="./lado_claro.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- OBJETIVO 1: Se activa con la 1ª imagen del compilador (index 0) -->
      
        <a-video src="#video1" width="1" height="0.56" position="0 0 0"></a-video>
      

      <!-- OBJETIVO 2: Se activa con la 2ª imagen del compilador (index 1) -->
      
        <a-video src="#video2" width="1" height="0.56" position="0 0 0"></a-video>
      

      <!-- OBJETIVO 3: Se activa con la 3ª imagen del compilador (index 2) -->
      
        <a-video src="#video3" width="1" height="0.56" position="0 0 0">
      

      <!-- OBJETIVO 4: Se activa con la 4ª imagen del compilador (index 3) -->
      
        <a-video src="#video4" width="1" height="0.56" position="0 0 0"></a-video>
      
      
    </a-scene>

    <script>
      // Control de reproducción automática (Play al detectar, Pause al perder de vista)
      const registrarControlVideo = (targetId, videoId) => {
        const target = document.querySelector(targetId);
        const video = document.querySelector(videoId);
        
        if (target && video) {
          target.addEventListener("targetFound", () => {
            console.log("Detectado:", targetId);
            video.play().catch(err => console.log("Error de autoplay:", err));
          });
          target.addEventListener("targetLost", () => {
            video.pause();
          });
        }
      };

      // Inicializamos el comportamiento individual para los 4 objetivos independientes
      registrarControlVideo('#target1', '#video1');
      registrarControlVideo('#target2', '#video2');
      registrarControlVideo('#target3', '#video3');
      registrarControlVideo('#target4', '#video4');
    </script>
  </body>
</html>
