<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Tabloide - Sin Marcas de Agua</title>
    
    <!-- Librerías oficiales nativas de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      .a-enter-vr { display: none !important; }
      
      /* Pantalla de inicio táctil obligatoria en iOS para habilitar videos grandes */
      #ui-inicio {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 15, 15, 0.95); display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 9999; color: white;
      }
      #btn-comenzar {
        padding: 16px 36px; font-size: 18px; border: none; background: #00e5ff;
        color: #111; border-radius: 30px; cursor: pointer; font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,229,255,0.4);
      }
    </style>
  </head>
  <body>

    <!-- Pantalla obligatoria para despertar los buffers en el iPad -->
    <div id="ui-inicio">
      <h2 style="margin-bottom: 20px;">Experiencia de Realidad Aumentada</h2>
      <button id="btn-comenzar">Iniciar Escáner</button>
    </div>

    <!-- Escena configurada con alta tolerancia para escaneos de gran escala (Tabloides) -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; warmupTolerance: 1; missTolerance: 15; filterMinCF: 0.0001;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- OPTIMIZACIÓN CLAVE: preload="none" para que videos de 40MB no tumben la memoria de Safari -->
        <video id="video1" src="./lado_claro_2.mp4" preload="none" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video2" src="./lado_oscuro.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video3" src="./lado_oscuro_2.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
        <video id="video4" src="./lado_claro.mp4" preload="auto" loop="true" playsinline muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- PROPORCIÓN Y ORIENTACIÓN VERTICAL PARA COMPOSICIÓN TABLOIDE (1:1.5) -->
      
        <a-video src="#video1" width="1" height="1.5" position="0 0 0"></a-video>
      

      
        <a-video src="#video2" width="1" height="1.5" position="0 0 0"></a-video>
      

      
        <a-video src="#video3" width="1" height="1.5" position="0 0 0"></a-video>
      

      
        <a-video src="#video4" width="1" height="1.5" position="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const btnComenzar = document.querySelector('#btn-comenzar');
      const uiInicio = document.querySelector('#ui-inicio');
      
      // Liberación táctil obligatoria solicitada por Apple iOS
      btnComenzar.addEventListener('click', () => {
        uiInicio.style.display = 'none';
        
        // Despierta de manera silenciosa los contenedores multimedia
        ['#video1', '#video2', '#video3', '#video4'].forEach(id => {
          const v = document.querySelector(id);
          if (v) { v.play().then(() => v.pause()).catch(e => console.log(e)); }
        });
      });

      // Controladores reactivos de reproducción por eventos de cámara
      const registrarControl = (targetId, videoId) => {
        const target = document.querySelector(targetId);
        const video = document.querySelector(videoId);
        
        if (target && video) {
          target.addEventListener("targetFound", () => {
            console.log("Detectado:", targetId);
            video.play().catch(err => console.log("Fallo streaming:", err));
          });
          target.addEventListener("targetLost", () => {
            video.pause();
          });
        }
      };

      registrarControl('#target1', '#video1');
      registrarControl('#target2', '#video2');
      registrarControl('#target3', '#video3');
      registrarControl('#target4', '#video4');
    </script>
  </body>
</html>
